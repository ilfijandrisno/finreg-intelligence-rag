name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Code Formatting Check (Ruff)
        run: ruff format --check .

      - name: Lint Check (Ruff)
        run: ruff check .

      - name: Type Check (Mypy)
        run: mypy src

      - name: Run Pytest Suite (Offline Mocks)
        env:
          ENVIRONMENT: testing
        run: pytest

      - name: Validate Docker Image Build
        run: docker build -t finreg-api:ci .
