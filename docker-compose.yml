services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: finreg_postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-finreg_db}
      POSTGRES_USER: ${POSTGRES_USER:-finreg_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finreg_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finreg_user} -d ${POSTGRES_DB:-finreg_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: finreg_postgres_data
